---
name: CI-Release
permissions: {}

on:
  release:
    types:
      - prereleased
      - released

concurrency:
  group: "_${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  organization:
    uses: LizardByte/.github/.github/workflows/__call-organization.yml@master

  npm:
    needs: organization
    name: NPM
    if: >-
      github.event.action == 'released' &&
      needs.organization.outputs.allowed == 'true'
    permissions:
      contents: read
      id-token: write  # required for provenance and OIDC
      packages: write
    uses: LizardByte/.github/.github/workflows/__call-update-npm.yml@master
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
    with:
      release_version: ${{ github.event.release.tag_name }}
